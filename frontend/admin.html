<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdminZero CTF — Admin Dashboard</title>
  <style>
    :root {
      --bg: #050505;
      --card: #0a0a0a;
      --border: #330000;
      --accent: #ff003c;
      --green: #00ff41;
      --red: #ff003c;
      --text: #e2e8f0;
      --mono: 'Courier New', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      background-image: 
        linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      padding: 2rem;
    }
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 3;
    }
    h1 {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 2rem;
      text-shadow: 2px 2px 0px rgba(255, 0, 60, 0.5);
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--border);
    }
    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #1a1a1a;
      font-size: 0.85rem;
    }
    th {
      background: #111;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: bold;
    }
    .status-blocked {
      color: var(--red);
      font-weight: bold;
    }
    .status-passed {
      color: var(--green);
      font-weight: bold;
    }
    code {
      background: #000;
      padding: 4px 8px;
      border-radius: 4px;
      color: var(--green);
      border: 1px solid var(--border);
      display: block;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .refresh-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-family: var(--mono);
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      margin-bottom: 1rem;
      border-radius: 4px;
    }
    .refresh-btn:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>System Audit Logs // Live</h1>
    <button class="refresh-btn" onclick="fetchLogs()">Refresh Logs</button>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Timestamp</th>
          <th>IP Address</th>
          <th>Status</th>
          <th>Reason</th>
          <th>Query Payload</th>
        </tr>
      </thead>
      <tbody id="logsTableBody">
        <tr><td colspan="6">Loading logs...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const CONFIG_BACKEND = "https://adminzeroctf.onrender.com";
    const API = (CONFIG_BACKEND && !CONFIG_BACKEND.includes("YOUR_BACKEND_URL"))
      ? CONFIG_BACKEND
      : (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
        ? "http://localhost:3001"
        : CONFIG_BACKEND;

    async function fetchLogs() {
      if (!API || API.includes("YOUR_BACKEND_URL")) {
        document.getElementById('logsTableBody').innerHTML = `<tr><td colspan="6" class="status-blocked">Please set your backend URL in admin.html (CONFIG_BACKEND).</td></tr>`;
        return;
      }
      try {
        const res = await fetch(`${API}/v1/ctf/logs`);
        const logs = await res.json();
        const tbody = document.getElementById('logsTableBody');
        tbody.innerHTML = '';

        if (logs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6">No logs found.</td></tr>';
          return;
        }

        logs.forEach(log => {
          const tr = document.createElement('tr');
          const isBlocked = log.blocked === 1;
          
          tr.innerHTML = `
            <td>${log.id}</td>
            <td>${log.timestamp}</td>
            <td>${log.ip}</td>
            <td class="${isBlocked ? 'status-blocked' : 'status-passed'}">
              ${isBlocked ? 'BLOCKED' : 'PASSED'}
            </td>
            <td>${log.reason || '-'}</td>
            <td><code>${log.query ? log.query.replace(/</g, '&lt;').replace(/>/g, '&gt;') : '-'}</code></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Failed to fetch logs", err);
        document.getElementById('logsTableBody').innerHTML = `<tr><td colspan="6" class="status-blocked">Error connecting to server.</td></tr>`;
      }
    }

    // Initial fetch and poll every 5 seconds
    fetchLogs();
    setInterval(fetchLogs, 5000);
  </script>
</body>
</html>
